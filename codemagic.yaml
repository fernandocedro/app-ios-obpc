workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          npx cap sync ios
