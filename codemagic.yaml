workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Build iOS (.ipa)
        script: |
          cd ios/App
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # COMANDO NOVO: Gera o arquivo de exportação usando os certificados do painel
          xcode-project use-profiles
          
          # COMANDO DE BUILD: Agora ele deve encontrar o plist gerado acima
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/library/developer/xcode/deriveddata/**/Build/Products/**/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
