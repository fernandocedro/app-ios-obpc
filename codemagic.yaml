workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Build iOS (.ipa)
        script: |
          cd ios/App
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # Tenta buscar os perfis configurados no painel do Codemagic
          xcode-project use-profiles --warn-only
          
          # Comando de build com limpeza e flags de assinatura manual
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --clean \
            --archive-flags "CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/library/developer/xcode/deriveddata/**/Build/Products/**/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
