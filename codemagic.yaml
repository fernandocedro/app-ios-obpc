workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          # Atualiza o projeto nativo com o novo appId do seu JSON
          npx cap sync ios
      - name: Force Bundle ID Update
        script: |
          # Comando de segurança: troca 'salto' por 'obpcschool' nos arquivos do Xcode
          sed -i '' 's/br.com.obpc.salto/br.com.obpcschool/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Build iOS (.ipa)
        script: |
          cd ios/App
          # Define a versão da build baseada na data/hora
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # Tenta usar os perfis (Certifique-se de que o perfil no site do Codemagic é br.com.obpcschool)
          xcode-project use-profiles --warn-only
          
          # Build final
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --clean
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
