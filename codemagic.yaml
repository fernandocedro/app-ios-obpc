workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          # Atualiza os arquivos nativos com br.com.obpcschool
          npx cap sync ios
      - name: Force Project Update
        script: |
          # Entra no arquivo que aparece na sua foto e troca os IDs na marra
          # Troca qualquer br.com.obpc.salto por br.com.obpcschool
          find . -type f -name "project.pbxproj" -exec sed -i '' 's/br.com.obpc.salto/br.com.obpcschool/g' {} +
      - name: Build iOS (.ipa)
        script: |
          cd ios/App
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # Tenta instalar os certificados que você subiu no painel
          xcode-project use-profiles --warn-only
          
          # Build ignorando erros de interface do Xcode
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --clean \
            --archive-flags "CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
