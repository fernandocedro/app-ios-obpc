workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Build iOS (.ipa)
        script: |
          cd ios/App
          # Atualiza a build number
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # 1. Instala os perfis do painel do Codemagic
          xcode-project use-profiles
          
          # 2. Build forçando o Xcode a ignorar a falta de seleção manual no projeto
          # O Codemagic vai usar o que você subiu no painel automaticamente
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --clean \
            --archive-flags "CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES AD_HOC_CODE_SIGNING_ALLOWED=YES"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
