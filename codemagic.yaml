workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Build iOS (.ipa)
        script: |
          # 1. ENTRAR NA PASTA ONDE O PROJETO ESTÁ
          cd ios/App
          
          # 2. ATUALIZAR A VERSÃO (OPCIONAL, MAS AJUDA NO UPLOAD)
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # 3. EXECUTAR O BUILD USANDO O ARQUIVO QUE VIMOS NO SEU GITHUB
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
