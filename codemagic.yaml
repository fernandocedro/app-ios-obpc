workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        # Substitua pelo seu ID da Apple ou deixe assim se for manual
        APP_STORE_APPLE_ID: "ferna@example.com" 
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Build iOS (.ipa)
        script: |
          cd ios/App
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # Este comando abaixo tenta fazer o build e gerar o arquivo de exportação sozinho
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --archive-flags "-allowProvisioningUpdates"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/library/developer/xcode/deriveddata/**/Build/Products/**/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
