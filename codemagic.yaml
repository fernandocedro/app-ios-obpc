workflows:
  ios-workflow:
    name: iOS Build OBPC
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        # Mantenha seu e-mail da Apple aqui se for usar publicação automática
        APP_STORE_APPLE_ID: "ferna@example.com" 
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
      - name: Capacitor Sync
        script: |
          npx cap sync ios
      - name: Build iOS (.ipa)
        script: |
          cd ios/App
          # Atualiza a build number para não dar conflito na Apple
          agvtool new-version -all $(date +%Y%m%d%H%M)
          
          # Comando de build corrigido
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/library/developer/xcode/deriveddata/**/Build/Products/**/*.ipa
    publishing:
      email:
        recipients:
          - ferna@example.com
