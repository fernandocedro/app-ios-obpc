name: "Gerar IPA Final"

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
          npx cap sync ios

      - name: Importar Certificados
        env:
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # CAMINHOS APONTANDO PARA A SUA PASTA github/workflows
          CERT_PATH="./github/workflows/teste.p12"
          PP_PATH="./github/workflows/OBPC_Salto_App_Store.mobileprovision"
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 1. Cria e desbloqueia a Keychain
          security create-keychain -p "$KEY_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEY_PASS" $KEYCHAIN_PATH

          # 2. Importa o arquivo físico (teste.p12)
          security import $CERT_PATH -k $KEYCHAIN_PATH -P "$P12_PASS" -A -T /usr/bin/codesign
          
          # 3. Autoriza o acesso
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEY_PASS" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | xargs)
          
          # 4. Instala o Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build e Export
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          # Archive com o UUID atualizado
          xcodebuild -project "$(basename "$PROJECT_PATH")" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="95cdc501-48b7-4989-93fe-2df3bf5ba356"

          # Export
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Download do IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-OBPC-iOS
          path: /Users/runner/work/_temp/export/*.ipa
          retention-days: 5
