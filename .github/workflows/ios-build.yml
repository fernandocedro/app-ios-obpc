name: "Gerar IPA Final"

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
          npx cap sync ios

      - name: Importar Certificados
        run: |
          # 1. Localiza os arquivos originais
          ORIGINAL_P12=$(find . -name "*.p12" -print -quit)
          PP_PATH=$(find . -name "*.mobileprovision" -print -quit)
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # 2. Conserto da criptografia (Essencial para não dar erro de senha)
          openssl pkcs12 -in "$ORIGINAL_P12" -out temp.pem -nodes -passin pass:apple
          openssl pkcs12 -export -out certificado_final.p12 -in temp.pem -passout pass:apple
          
          # 3. Configura Keychain
          security create-keychain -p apple "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p apple "$KEYCHAIN_PATH"

          # 4. Importa P12 e Perfil
          security import certificado_final.p12 -k "$KEYCHAIN_PATH" -P apple -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k apple "$KEYCHAIN_PATH"
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # 5. Extrai o UUID real do perfil automaticamente (Evita erro de digitação)
          UUID=$(grep -aA1 "UUID" "$PP_PATH" | grep -o "[-A-Z0-9]\{36\}")
          echo "UUID_REAL=$UUID" >> $GITHUB_ENV

      - name: Build e Export
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          # Archive usando o UUID extraído automaticamente
          xcodebuild -project "$(basename "$PROJECT_PATH")" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.UUID_REAL }}"

          # Export
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Download do IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-OBPC-iOS
          path: /Users/runner/work/_temp/export/*.ipa
          retention-days: 5
