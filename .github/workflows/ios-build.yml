name: "Gerar IPA Final"

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
          npx cap sync ios

      - name: Importar Certificados
        run: |
          CERT_PATH="./.github/workflows/teste.p12"
          PP_PATH=$(find . -name "*.mobileprovision" -print -quit)
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # 1. Cria e desbloqueia a Keychain com senha fixa 'apple'
          security create-keychain -p apple "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p apple "$KEYCHAIN_PATH"

          # 2. Importa o P12 com a senha fixa 'apple'
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P apple \
            -A \
            -T /usr/bin/codesign
          
          # 3. Autoriza o acesso
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k apple "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          
          # 4. Instala o Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build e Export
        run: |
          # Procura o projeto na pasta ios/App
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          # Archive - Usando o UUID do seu perfil
          xcodebuild -project "$(basename "$PROJECT_PATH")" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="95cdc501-48b7-4989-93fe-2df3bf5ba356"

          # Export (Certifique-se que o exportOptions.plist existe na pasta ios/App/App/)
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Download do IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-OBPC-iOS
          path: /Users/runner/work/_temp/export/*.ipa
          retention-days: 5
