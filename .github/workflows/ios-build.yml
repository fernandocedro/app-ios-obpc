name: "Build iOS IPA"

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Isso ajuda a evitar o erro de depreciação durante a execução
          check-latest: true 

      - name: Install dependencies
        run: |
          npm install
          npx cap sync ios

      - name: Build IPA (Teste de Sucesso)
        run: |
          # Caminho profundo que você confirmou
          cd ios/App/App
          
          # Build sem assinatura apenas para validar o código
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build
