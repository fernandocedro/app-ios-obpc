name: "Build iOS IPA"

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2 # Versão atualizada

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.2 # Versão atualizada
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npx cap sync ios

      - name: Build IPA (Teste de Sucesso)
        run: |
          # Entrando na pasta exata que você confirmou
          cd ios/App/App
          
          # Listar arquivos para log de segurança
          ls -F
          
          # Comando de build que valida se o projeto está saudável
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build
