name: "Build iOS IPA"

on:
  workflow_dispatch: 

env:
  # Isso silencia o aviso e força o uso do Node 24 em todas as ações
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npx cap sync ios

      - name: Build IPA (Teste de Sucesso)
        run: |
          # Caminho profundo confirmado: IOS / APP / APP
          cd ios/App/App
          
          # Build de release sem assinatura para validar os arquivos
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build
