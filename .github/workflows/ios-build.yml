name: "Gerar IPA Final"

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Selecionar Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
          npx cap sync ios

      - name: Atualizar Build Number Automaticamente
        run: |
          cd ios/App
          sed -i '' 's/VERSIONING_SYSTEM = "internal";/VERSIONING_SYSTEM = "apple-generic";/g' App.xcodeproj/project.pbxproj || true
          xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Importar Certificados
        run: |
          # 1. Localiza os arquivos na raiz
          ORIGINAL_P12=$(find . -name "*.p12" -print -quit)
          PP_PATH=$(find . -name "*.mobileprovision" -print -quit)
          
          echo "Arquivos encontrados: $ORIGINAL_P12 e $PP_PATH"

          # 2. Conserto da criptografia e extração do NOME exato do certificado
          openssl pkcs12 -in "$ORIGINAL_P12" -out temp.pem -nodes -passin pass:apple
          openssl pkcs12 -export -out certificado_final.p12 -in temp.pem -passout pass:apple
          
          # Extrai o Common Name (CN) para saber se é "Apple Distribution" ou "iPhone Distribution"
          CERT_IDENTITY=$(openssl x509 -inform pem -in temp.pem -noout -subject -nameopt RFC2253 | sed -n 's/.*CN=\([^,]*\).*/\1/p')
          echo "CERT_IDENTITY=$CERT_IDENTITY" >> $GITHUB_ENV

          # 3. Configura Keychain de forma robusta
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p apple "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p apple "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # 4. Importa P12 e Perfil
          security import certificado_final.p12 -k "$KEYCHAIN_PATH" -P apple -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k apple "$KEYCHAIN_PATH"
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # 5. Extração de dados do Perfil
          security cms -D -i "$PP_PATH" > provision.xml
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" provision.xml)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print ApplicationIdentifierPrefix:0" provision.xml)
          FULL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" provision.xml)
          BUNDLE_ID=$(echo $FULL_BUNDLE_ID | sed "s/$TEAM_ID.//")

          echo "UUID_REAL=$UUID" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          
          echo "✅ Identity Detectada: $CERT_IDENTITY"

      - name: Build e Export
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          # Cria o exportOptions.plist dinamicamente
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ env.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key>
              <string>${{ env.UUID_REAL }}</string>
            </dict>
          </dict>
          </plist>
          EOF

          # Archive (Usando a Identity e Team detectados automaticamente)
          xcodebuild -project "$(basename "$PROJECT_PATH")" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ env.CERT_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.UUID_REAL }}" \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}"

          # Export
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Download do IPA
        uses: actions/with
        uses: actions/upload-artifact@v4
        with:
          name: App-OBPC-iOS
          path: /Users/runner/work/_temp/export/*.ipa
          retention-days: 5
