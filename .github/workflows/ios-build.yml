name: "Build iOS IPA"

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npx cap sync ios

      - name: Build IPA (Localização Automática)
        run: |
          # Este comando procura onde está o .xcodeproj e entra na pasta dele sozinho
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          
          echo "Projeto encontrado em: $PROJECT_PATH"
          cd "$PROJECT_DIR"
          
          # Listar o que tem dentro para confirmar no log
          ls -F
          
          # Rodar o build usando o nome do arquivo que ele encontrou
          xcodebuild -project "$(basename "$PROJECT_PATH")" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build
