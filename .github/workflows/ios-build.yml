name: "Gerar IPA Final"

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli
          npx cap sync ios

      - name: Importar Certificados
        run: |
          # 1. Localiza os arquivos originais (Pode estar em qualquer pasta)
          ORIGINAL_P12=$(find . -name "*.p12" -print -quit)
          PP_PATH=$(find . -name "*.mobileprovision" -print -quit)
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "Certificado encontrado: $ORIGINAL_P12"
          
          # 2. CONSERTO MÁGICO: Reconstrói o P12 dentro do Mac para evitar erro de MAC verification
          # Primeiro extrai para PEM (passando a senha 'apple')
          openssl pkcs12 -in "$ORIGINAL_P12" -out temp.pem -nodes -passin pass:apple
          # Depois reconstrói o P12 no formato nativo do macOS
          openssl pkcs12 -export -out certificado_final.p12 -in temp.pem -passout pass:apple
          
          # 3. Cria e desbloqueia a Keychain
          security create-keychain -p apple "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p apple "$KEYCHAIN_PATH"

          # 4. Importa o novo arquivo que acabamos de criar
          security import certificado_final.p12 \
            -k "$KEYCHAIN_PATH" \
            -P apple \
            -A \
            -T /usr/bin/codesign
          
          # 5. Autoriza o acesso à chave privada
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k apple "$KEYCHAIN_PATH"
          
          # 6. Instala o Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build e Export
        run: |
          # Localiza o projeto Xcode
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          
          # Archive
          xcodebuild -project "$(basename "$PROJECT_PATH")" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="95cdc501-48b7-4989-93fe-2df3bf5ba356"

          # Export (O arquivo exportOptions.plist deve estar na pasta ios/App/App/)
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Download do IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-OBPC-iOS
          path: /Users/runner/work/_temp/export/*.ipa
          retention-days: 5
