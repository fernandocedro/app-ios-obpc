name: "Build iOS IPA"

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npx cap sync ios

      - name: Build IPA (Caminho Corrigido)
        run: |
          # Entrando na estrutura profunda que você descreveu
          cd ios/App/App
          
          # Listar arquivos para confirmar que estamos no lugar certo
          ls -F
          
          # Comando de build apontando para o projeto correto
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO
